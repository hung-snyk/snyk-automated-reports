name: Snyk issue reports

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      reports:
        description: Comma list of report slugs, or "all"
        default: "all"
      days:
        description: Report window in days (empty = each report's UI default)
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90           # large exports can take a while to finish
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}       # or set SNYK_GROUP_ID instead
      SNYK_GROUP_ID: ${{ vars.SNYK_GROUP_ID }}
      SNYK_REGION: ${{ vars.SNYK_REGION || 'us' }}
      SNYK_ORG_NAME: ${{ vars.SNYK_ORG_NAME }}
      REPORTS: ${{ inputs.reports || vars.REPORTS || 'all' }}
      REPORT_DAYS: ${{ inputs.days }}
      ZERO_DAY_CVE: ${{ vars.ZERO_DAY_CVE }}
      REPORT_OUT: reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python snyk_reports.py --save-raw
      - uses: actions/upload-artifact@v4
        with:
          name: snyk-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
