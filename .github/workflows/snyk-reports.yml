name: Snyk issue reports

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      reports:
        description: Report(s) to build, comma-separated, e.g. issues-summary,sla-management (empty = the REPORTS variable)
        default: ""
      days:
        description: Report window in days (empty = each report's UI default)
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90           # large exports can take a while to finish
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG_ID: ${{ vars.SNYK_ORG_ID }}       # or set SNYK_GROUP_ID instead
      SNYK_GROUP_ID: ${{ vars.SNYK_GROUP_ID }}
      SNYK_REGION: ${{ vars.SNYK_REGION || 'us' }}
      REPORTS: ${{ inputs.reports || vars.REPORTS }}   # required: the reports to build, comma-separated
      REPORT_DAYS: ${{ inputs.days }}
      REPORT_FORMATS: ${{ vars.REPORT_FORMATS || 'pdf' }}   # pdf, csv and/or json, comma-separated
      ZERO_DAY_CVE: ${{ vars.ZERO_DAY_CVE }}
      REPORT_FILTERS: ${{ vars.REPORT_FILTERS }}  # ;-separated --filter values
      REPORT_OUT: reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check which reports to build
        run: |
          if [ -z "$REPORTS" ]; then
            echo "::error::Set the REPORTS repository variable (or the 'reports' input) to the reports to build, comma-separated. Run 'python snyk_reports.py --list' for names."
            exit 1
          fi
      - run: pip install -r requirements.txt
      - run: python snyk_reports.py
      - uses: actions/upload-artifact@v4
        with:
          name: snyk-reports-${{ github.run_number }}
          path: reports/    # raw exports are never saved here
          retention-days: 30
